name: CDK Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Dev環境: 自動デプロイ
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590183940496:role/test-github-actions-cdk-deploy
          aws-region: ap-northeast-1

      - name: CDK Deploy Dev
        run: npx cdk deploy Dev-NetworkStack Dev-AppStack --require-approval never

  # Prod環境: 手動承認後にデプロイ
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-dev  # Dev成功後に実行
    environment: production  # 承認が必要
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590183940496:role/test-github-actions-cdk-deploy
          aws-region: ap-northeast-1

      - name: CDK Deploy Prod
        run: npx cdk deploy Prod-NetworkStack Prod-AppStack --require-approval never
